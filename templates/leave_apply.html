{% extends "base.html" %}
{% block title %}Apply for Leave{% endblock %}
{% block wrapper_class %}wide{% endblock %}
{% block card_class %}wide{% endblock %}
{% block content %}
  <h1>Apply for Leave</h1>
  <form method="POST" action="{{ url_for('shaj.apply_leave') }}">

    <label for="supervisor_id">To (Supervisor)</label>
    <select id="supervisor_id" name="supervisor_id" required>
      <option value="" disabled selected>-- Select a supervisor --</option>
      {% for sup in supervisors %}
        <option value="{{ sup.supervisor_id }}">{{ sup.supervisor_name }}</option>
      {% endfor %}
    </select>

    <label for="leave_days">Leave Days</label>
    <input type="number" id="leave_days" name="leave_days" min="1" required>

    <label for="start_date">Leave Start Date</label>
    <input type="date" id="start_date" name="start_date" required>

    <label for="return_date">Return Date</label>
    <input type="date" id="return_date" name="return_date" required>

    <label for="reason">Leave Reason</label>
    <textarea id="reason" name="reason" rows="6" required placeholder="Explain your reason for leave..."></textarea>

    <button type="submit" class="btn">Submit Leave Application</button>
  </form>
  <p class="switch-link"><a href="{{ url_for('shaj.my_leaves') }}">View my leave applications</a></p>
{% endblock %}
